<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRICKET ANIMATION</title>
    <link rel="shortcut icon" href="./assets/images/cricket-bat.png" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="pitch">
        <div class="br-1"></div>
        <div class="br-2"></div>
    </div>

    <div class="ball"></div>

    <div class="lf-stick-1 st-cm"></div>
    <div class="lf-stick-2 st-cm"></div>
    <div class="lf-stick-3 st-cm"></div>

    <div class="bail-1 bl-cm"></div>
    <div class="bail-2 bl-cm"></div>
    
    <div class="rt-stick-1 st-cm"></div>
    <div class="rt-stick-2 st-cm"></div>
    <div class="rt-stick-3 st-cm"></div>
    

    <div class="bail-3 bl-cm"></div>
    <div class="bail-4 bl-cm"></div>

    <div class="show"><img src="./assets/images/bowled.png" alt="bowled"></div>
</body>
</html>
